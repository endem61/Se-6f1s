<style>
html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}[hidden]{display:none!important}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
/* Layout: Tablet-App — feste Kopfzeile, Inhalt in Karten, untere Tab-Leiste. Farbton "Beere" wie ein Haarfarbton. */
:root{
  --bg:#f5f1f2; --surface:#ffffff; --surface2:#efe8ea; --fg:#241a1e; --muted:#6e6065; --line:#e1d6da;
  --accent:#8a2d52; --accent-fg:#ffffff; --accent-soft:#f4e4eb;
  --c-ein:#8a2d52;--c-aus:#2f6fb0;
  --ok:#2e7a4d; --ok-soft:#e3f1e8; --warn:#9a6210; --warn-soft:#f8ecd6; --bad:#b1261e; --bad-soft:#f8e2e0;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:12px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151113; --surface:#1f191c; --surface2:#2a2226; --fg:#f2eaed; --muted:#b2a2a8; --line:#3a2f34;
  --accent:#e27ba4; --accent-fg:#1c0f15; --accent-soft:#3a2230;
  --c-ein:#c95a88;--c-aus:#4f8fd0;--ok:#6cc18c; --ok-soft:#1e3326; --warn:#e2a74c; --warn-soft:#3a2d17; --bad:#f08a82; --bad-soft:#3d1f1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151113; --surface:#1f191c; --surface2:#2a2226; --fg:#f2eaed; --muted:#b2a2a8; --line:#3a2f34;
  --accent:#e27ba4; --accent-fg:#1c0f15; --accent-soft:#3a2230;
  --c-ein:#c95a88;--c-aus:#4f8fd0;--ok:#6cc18c; --ok-soft:#1e3326; --warn:#e2a74c; --warn-soft:#3a2d17; --bad:#f08a82; --bad-soft:#3d1f1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.7rem} h2{font-size:1.3rem} h3{font-size:1.08rem}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.86rem}
.label{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{font-family:var(--f-display);font-size:1.25rem;font-weight:600;color:var(--accent)}
.status-dot{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.status-dot i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.status-dot.on i{background:var(--ok)}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px))}
.view-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.actions{display:flex;flex-wrap:wrap;gap:8px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);height:var(--nav-h)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:.74rem;font-weight:600;cursor:pointer;position:relative}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .badge{position:absolute;top:8px;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:9px;font-size:.68rem;min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:0;background:none;font-size:1.6rem;line-height:1;width:44px;height:44px;cursor:pointer;color:var(--muted);border-radius:10px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{margin-bottom:10px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:1.6rem;font-variant-numeric:tabular-nums;font-weight:700}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row.click{cursor:pointer;border-radius:8px}
.row.click:hover{background:var(--surface2)}
.row .grow{flex:1;min-width:0}
.row .title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{font-variant-numeric:tabular-nums;font-weight:700;min-width:52px}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:.78rem;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.notice{border-radius:10px;padding:12px 14px;background:var(--warn-soft);color:var(--fg);font-size:.92rem}
.notice.info{background:var(--accent-soft)}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.85rem;font-weight:600;color:var(--muted)}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
input[type=text],input[type=password],input[type=tel],input[type=email],input[type=date],input[type=time],input[type=number],input[type=search],input:not([type]),select,textarea{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:80px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.check input{width:22px;height:22px;margin-top:1px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:8px 14px;cursor:pointer;font-weight:500;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:9px 14px;cursor:pointer;font-weight:600;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;min-width:0}
.day .wd{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day .dn{font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.day .cnt{font-size:.72rem;color:var(--accent);min-height:1em}
.day[aria-current="date"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.day[aria-current="date"] .wd,.day[aria-current="date"] .cnt{color:var(--accent-fg)}
.day.today .dn{text-decoration:underline;text-underline-offset:3px}
.appt{display:flex;gap:12px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;border-left:4px solid var(--accent)}
.appt.erledigt{border-left-color:var(--ok);opacity:.8}
.appt.abgesagt{border-left-color:var(--line);opacity:.55;text-decoration:line-through}

.split{display:grid;gap:16px}
@media (min-width:900px){.split{grid-template-columns:minmax(280px,1fr) 2fr}}
@media (max-width:899px){.split.has-sel .pane-list{display:none}}
@media (min-width:900px){.back-btn{display:none!important}}

.visit{border-top:1px solid var(--line);padding-block:14px;display:flex;flex-direction:column;gap:6px}
.visit:first-child{border-top:0}
.recipe{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.88rem;background:var(--surface2);border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{width:92px;height:92px;border-radius:10px;object-fit:cover;border:1px solid var(--line);cursor:pointer;background:var(--surface2)}
.thumb-wrap{position:relative}
.thumb-wrap button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:0;background:var(--bad);color:#fff;cursor:pointer;font-weight:700}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num,th.num{text-align:right;white-space:nowrap}
tr.storno td{color:var(--muted);text-decoration:line-through}
.plus{color:var(--ok)} .minus{color:var(--bad)}
.bar{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.stock{font-variant-numeric:tabular-nums;font-weight:700;min-width:44px;text-align:right}
.stepper{display:flex;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.2rem;font-weight:700;cursor:pointer}

/* Formulare als eigene Seite (kein schwebendes Fenster) – scrollt mit einem Finger */
#modal-root{display:block}
.scrim{display:none}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:860px;margin:0 auto;display:flex;flex-direction:column}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 12px 8px 20px;gap:10px}
.modal-body{padding:4px 20px 20px;display:flex;flex-direction:column;gap:14px}
/* Kassen-Seite */
.pos{display:grid;gap:16px}
@media (min-width:900px){.pos{grid-template-columns:1.7fr 1fr;align-items:start}}
.pos .chip{min-height:56px;padding:12px 18px;font-size:1.02rem;border-radius:12px}
.pos #f-betrag{font-size:2rem;font-weight:700;min-height:64px;font-variant-numeric:tabular-nums}
.pos-go{width:100%;min-height:60px;font-size:1.15rem}
.notice.ok{background:var(--ok-soft)}
.big-in{font-size:1.6rem!important;font-weight:700;min-height:60px!important;font-variant-numeric:tabular-nums}
.pos-display{background:var(--surface2);border-radius:14px;padding:14px 18px;text-align:right}
#pos-amount{font-size:3rem;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.pos-quick .chip{flex:1 1 140px;min-height:58px;font-size:1.05rem;font-weight:600;border-radius:12px}
.pos-quick .chip small{font-weight:500;opacity:.8}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{min-height:68px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:1.7rem;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.keypad button:active{background:var(--accent-soft)}
.pay-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pos-pay{min-height:84px;font-size:1.5rem;border-radius:14px;background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pos-pay[data-v="karte"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.bon{border-style:dashed}
.pin-dots{display:flex;gap:12px;justify-content:center}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pin-dots i.on{background:var(--accent);border-color:var(--accent)}
#print-area{display:none}
@media print{body>*{display:none!important}#print-area{display:block!important;width:72mm;font:12px/1.35 ui-monospace,Menlo,monospace;color:#000}
 #print-area .c{text-align:center}#print-area .r{display:flex;justify-content:space-between;gap:8px}#print-area hr{border:0;border-top:1px dashed #000}@page{size:80mm auto;margin:3mm}}
.modal-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding-top:6px}
.modal img.full{width:100%;border-radius:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-weight:600;max-width:calc(100% - 32px)}
.denoms{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.denom{display:flex;align-items:center;gap:8px}
.denom span{min-width:62px;font-variant-numeric:tabular-nums;font-weight:600}
.legal p{margin:.35em 0 .9em;max-width:70ch}
#scan-reader{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#scanner{position:fixed;inset:0;z-index:40;background:rgba(10,6,8,.92);display:flex;align-items:center;justify-content:center;padding:16px}
#scanner .box{background:var(--surface);border-radius:16px;width:min(560px,100%);padding:16px;display:grid;gap:12px}
#cam-reader{width:100%;min-height:240px;border-radius:12px;overflow:hidden;background:#000}
#cam-reader video{width:100%!important;height:auto!important;border-radius:12px}
.pthumb{width:52px;height:52px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:var(--surface2);flex:none;cursor:pointer}
.pthumb.ph{display:grid;place-items:center;font:600 1.3rem var(--f-display);color:var(--muted)}
.pthumb.big{width:110px;height:110px}
.role-user [data-act=storno],.role-user [data-act=kunde-del],.role-user [data-act=besuch-del],.role-user [data-act=artikel-del]{display:none!important}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}.chart .axis{stroke:var(--muted);stroke-width:1}
.chart .tick{fill:var(--muted);font:500 11px var(--f-body);font-variant-numeric:tabular-nums}
.chart .c-ein{fill:var(--c-ein)}.chart .c-aus{fill:var(--c-aus)}.chart .hit{fill:transparent;cursor:pointer}.chart .hit:hover{fill:var(--fg);fill-opacity:.05}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}.legend span{display:flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px}.sw.c-ein{background:var(--c-ein)}.sw.c-aus{background:var(--c-aus)}
#ctip{position:fixed;z-index:60;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:.85rem;line-height:1.35;font-variant-numeric:tabular-nums}
.wtab td{vertical-align:middle}.wtab input{min-height:48px;font-size:1.1rem;text-align:right;font-variant-numeric:tabular-nums}
.lockbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-weight:600;cursor:pointer}
</style>
</head><body>

<header class="topbar"><div class="topbar-in">
  <span class="brand" id="brand">SEEN Salon</span>
  <span style="display:flex;gap:10px;align-items:center"><span class="status-dot" id="conn"><i></i><span>Startet …</span></span><button class="lockbtn" id="lockbtn" data-act="logout" hidden>Abmelden</button></span>
</div></header>
<main><div id="modal-root" hidden></div><div id="view"></div></main>
<nav class="tabs" aria-label="Bereiche"><div class="in" id="nav"></div></nav>
<div id="scan-reader"></div>
<input type="file" id="scan-input" accept="image/*" capture="environment" hidden>
<input type="file" id="beleg-input" accept="image/*,application/pdf" multiple hidden>
<div class="toast" id="toast" hidden></div>
<div id="scanner" hidden role="dialog" aria-label="Barcode scannen"><div class="box">
 <div style="display:flex;justify-content:space-between;align-items:center"><h2 id="scan-title">Barcode scannen</h2><button class="icon-btn" data-scan="cancel" aria-label="Schließen">×</button></div>
 <div id="cam-reader"></div><div id="scan-msg" class="small muted">Barcode in den Rahmen halten …</div><div id="scan-list" class="small" hidden></div>
 <div class="fields" style="align-items:end"><div class="field"><label for="scan-manual">Oder Nummer eintippen</label><input id="scan-manual" inputmode="numeric" autocomplete="off"></div><button class="btn" data-scan="manual">Übernehmen</button></div>
 <div class="actions"><button class="btn" data-scan="photo">Foto statt Kamera</button><button class="btn" data-scan="cancel" id="scan-cancel">Abbrechen</button></div></div></div>

<script>
/* ---------- Helfer ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const isoDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>isoDate(new Date());
const nowTime=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const parseDate=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(s,n)=>{const d=parseDate(s);d.setDate(d.getDate()+n);return isoDate(d)};
const fmtDate=s=>s?parseDate(s).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}):'';
const fmtDateLong=s=>parseDate(s).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fmtTs=ts=>new Date(ts).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
const eur=c=>((c||0)/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const eurPlain=c=>((c||0)/100).toFixed(2).replace('.',',');
const parseEur=s=>{if(s==null)return NaN;s=String(s).trim().replace(/\s|€/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const v=Number(s);return isFinite(v)?Math.round(v*100):NaN};
const num=v=>{const n=Number(String(v??'').replace(',','.'));return isFinite(n)?n:0};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o??{}));

function derive(col,docs){
  S.raw[col]=docs;
  if(col==='kunden'||col==='artikel'){S[col]=docs.map(d=>({id:d.id,...d.data}));return}
  if(col==='besuche'){S.besuche=docs.flatMap(d=>(d.data.list||[]).map(v=>({...v,kundeId:d.id})));return}
  if(col==='termine'){S.termine=docs.flatMap(d=>(d.data.list||[]).map(t=>({...t,_doc:d.id})));return}
  if(col==='bewegungen'){S.bewegungen=docs.flatMap(d=>(d.data.list||[]));return}
  if(col==='kasse'){
    S.kasse=docs.flatMap(d=>(d.data.entries||[])).sort((a,b)=>a.nr<b.nr?-1:a.nr>b.nr?1:0);
    S.abschluesse=docs.flatMap(d=>(d.data.abschluesse||[])).sort((a,b)=>a.ts<b.ts?1:-1);
  }
}
const queues={};
function mutate(path,fn){
  const p=(queues[path]||Promise.resolve()).then(async()=>{
    const ref=db.doc(path);const snap=await ref.get();
    const next=fn(snap.exists?clone(snap.data()):{});
    await ref.set(next);return next;});
  queues[path]=p.catch(()=>{});return p;
}

async function lagerBewegung(artikelId,delta,art,notiz,extra={}){
  const a=await mutate('artikel/'+artikelId,d=>{d.bestand=Math.round((num(d.bestand)+delta)*1000)/1000;if(d.bestand<=0)d.mhd='';if(extra.mhd&&delta>0&&(!d.mhd||d.mhd<today()||extra.mhd<d.mhd))d.mhd=extra.mhd;return d});
  delete extra.mhd;
  const dt=today();
  await mutate('bewegungen/'+halfKey(dt),d=>{d.list=d.list||[];d.list.push({id:uid(),artikelId,artikelName:a.name||'',art,menge:delta,bestandNach:a.bestand,ts:new Date().toISOString(),notiz:notiz||'',...extra});return d});
  return a;
}

async function compressImage(file,max=1600,q=.82){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',q));
  }finally{URL.revokeObjectURL(url)}
}
async function uploadFoto(file){
  if(!assets)throw {code:'not_granted'};
  const blob=await compressImage(file,2400,.88);
  const r=await assets.upload(blob,{type:'image/jpeg'});return r.id;
}

/* ================= Familienversicherung: Gewinngrenze (nur Admin) ================= */
function fvStand(){
  const y=String(new Date().getFullYear());const t=today();
  const L=S.kasse.filter(k=>String(k.datum).startsWith(y)&&k.datum<=t&&!isPrivat(k));
  const E=L.filter(k=>k.art==='einnahme').reduce((a,k)=>a+k.betrag,0),A=L.filter(k=>k.art==='ausgabe').reduce((a,k)=>a+k.betrag,0);const G=E-A;
  const monat=Number(S.settings.fvGrenzeMonat)||56500;const sonst=Number(S.settings.fvSonstige)||0;const grenzeAlle=monat*12;const grenze=grenzeAlle-sonst*12;const warn=Number(S.settings.fvWarn)||500000;
  const ruhe=ruhetage();const arbeitstage=[...new Set(L.filter(k=>k.tagesEinnahme).map(k=>k.datum))].length;
  let rest=0;for(let d=addDays(t,1);d.slice(0,4)===y;d=addDays(d,1)){if(!ruhe.includes(parseDate(d).getDay()))rest++}
  const proTag=arbeitstage?G/arbeitstage:0;const proj=Math.round(G+proTag*rest);
  const spiel=grenze-G;const moeglich=proTag>0?Math.floor(spiel/proTag):rest;const schliessen=proTag>0?Math.max(0,rest-Math.max(0,moeglich)):0;
  return {y,E,A,G,monat,grenze,grenzeAlle,sonst,warn,arbeitstage,rest,proTag,proj,spiel,schliessen,L};
}
function kasseFV(){
  const f=fvStand();const pct=v=>Math.max(0,Math.min(100,v/f.grenze*100));
  const status=f.G>=f.grenze?['bad','Grenze überschritten']:f.proj>f.grenze?['bad','Grenze wird voraussichtlich überschritten']:f.G>=f.warn?['warn','Warnschwelle erreicht']:['ok','Im Rahmen'];
  // kumulierter Gewinn je Monat
  const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];let cum=0;const cm=new Date().getMonth();
  const pts=MON.map((n,i)=>{const mk=f.y+'-'+pad(i+1);const ML=f.L.filter(k=>ymOf(k.datum)===mk);cum+=ML.filter(k=>k.art==='einnahme').reduce((a,k)=>a+k.betrag,0)-ML.filter(k=>k.art==='ausgabe').reduce((a,k)=>a+k.betrag,0);return {n,v:cum,zukunft:i>cm}});
  const W=720,H=230,l=62,r=10,t=14,b=26,iw=W-l-r,ih=H-t-b,gw=iw/12;const top=Math.max(f.grenze*1.15,...pts.map(p=>p.v));
  const ys=v=>t+ih-(Math.max(0,v)/top)*ih;const ax=x=>(x/100).toLocaleString('de-DE',{maximumFractionDigits:0})+' €';
  let g=[0,.5,1].map(q=>`<line class="grid" x1="${l}" x2="${W-r}" y1="${ys(top*q)}" y2="${ys(top*q)}"/><text class="tick" x="${l-6}" y="${ys(top*q)+4}" text-anchor="end">${ax(top*q)}</text>`).join('');
  g+=pts.map((p,i)=>{const cx=l+gw*i+gw/2,bw=Math.min(30,gw-12);if(p.zukunft)return `<text class="tick" x="${cx}" y="${H-8}" text-anchor="middle">${p.n}</text>`;const y0=t+ih,y1=ys(p.v),h=y0-y1,rr=Math.min(4,h,bw/2);
    return (p.v>0?`<path class="c-ein" d="M${cx-bw/2},${y0}V${y1+rr}Q${cx-bw/2},${y1} ${cx-bw/2+rr},${y1}H${cx+bw/2-rr}Q${cx+bw/2},${y1} ${cx+bw/2},${y1+rr}V${y0}Z"/>`:'')+`<text class="tick" x="${cx}" y="${H-8}" text-anchor="middle">${p.n}</text><rect class="hit" x="${l+gw*i}" y="${t}" width="${gw}" height="${ih}" data-tip="<b>Ende ${p.n}</b><br>Gewinn seit 1.1.: ${eur(p.v)}"/>`}).join('');
  g+=`<line x1="${l}" x2="${W-r}" y1="${ys(f.grenze)}" y2="${ys(f.grenze)}" style="stroke:var(--bad);stroke-width:2;stroke-dasharray:6 4"/><text x="${W-r}" y="${ys(f.grenze)-6}" text-anchor="end" class="tick" style="fill:var(--bad);font-weight:700">${f.sonst?'Grenze für Gewinn':'Grenze'} ${ax(f.grenze)}</text>`;
  g+=`<line x1="${l}" x2="${W-r}" y1="${ys(f.warn)}" y2="${ys(f.warn)}" style="stroke:var(--warn);stroke-width:2;stroke-dasharray:3 4"/><text x="${l+6}" y="${ys(f.warn)-6}" class="tick" style="fill:var(--warn);font-weight:700">Warnung ${ax(f.warn)}</text>`;
  return `<div class="grid g3" style="margin-bottom:16px">
    <div class="card stat"><span class="label">Gewinn ${f.y} bisher</span><b>${eur(f.G)}</b><span class="small"><span class="pill ${status[0]}">${status[1]}</span></span></div>
    <div class="card stat"><span class="label">Noch Spielraum bis Grenze</span><b class="${f.spiel<0?'minus':''}">${eur(f.spiel)}</b><span class="small muted">${eur(f.monat)} × 12 = ${eur(f.grenzeAlle)}${f.sonst?` − Miete ${eur(f.sonst*12)} = <b>${eur(f.grenze)}</b> für den Gewinn`:''}</span></div>

function chartMonate(y,L){
  const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  const d=MON.map((n,i)=>{const mk=y+'-'+pad(i+1);const ML=L.filter(k=>ymOf(k.datum)===mk&&!isPrivat(k));
    const e=ML.filter(k=>k.art==='einnahme').reduce((a,k)=>a+k.betrag,0),a=ML.filter(k=>k.art==='ausgabe').reduce((s,k)=>s+k.betrag,0);return {n,mk,e,a,g:e-a}});
  if(!d.some(x=>x.e||x.a))return '';
  const W=720,H=230,l=58,r=10,t=14,b=26,iw=W-l-r,ih=H-t-b,gw=iw/12;
  const nice=v=>{if(v<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(v)));const m=v/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p};
  const ax=x=>(x/100).toLocaleString('de-DE',{maximumFractionDigits:0})+' €';
  const top=nice(Math.max(...d.map(x=>Math.max(x.e,x.a))));const ys=v=>t+ih-(v/top)*ih;
  const bar=(x,w,v,cls)=>{if(v<=0)return '';const y0=t+ih,y1=ys(v),h=y0-y1,rr=Math.min(4,h,w/2);return `<path class="${cls}" d="M${x},${y0}V${y1+rr}Q${x},${y1} ${x+rr},${y1}H${x+w-rr}Q${x+w},${y1} ${x+w},${y1+rr}V${y0}Z"/>`};
  const bw=Math.min(18,(gw-10)/2);
  let g1=[0,.25,.5,.75,1].map(f=>`<line class="grid" x1="${l}" x2="${W-r}" y1="${ys(top*f)}" y2="${ys(top*f)}"/><text class="tick" x="${l-6}" y="${ys(top*f)+4}" text-anchor="end">${ax(top*f)}</text>`).join('');
  g1+=d.map((x,i)=>{const cx=l+gw*i+gw/2;return bar(cx-bw-1,bw,x.e,'c-ein')+bar(cx+1,bw,x.a,'c-aus')+`<text class="tick" x="${cx}" y="${H-8}" text-anchor="middle">${x.n}</text><rect class="hit" x="${l+gw*i}" y="${t}" width="${gw}" height="${ih}" data-tip="<b>${x.n} ${y}</b><br>Einnahmen ${eur(x.e)}<br>Ausgaben ${eur(x.a)}<br>${x.g<0?'Verlust':'Gewinn'} ${eur(x.g)}"/>`}).join('');
  const gm=Math.max(...d.map(x=>Math.abs(x.g)));const gtop=nice(gm);const H2=170,ih2=H2-t-b,z=t+ih2/2,gy=v=>z-(v/gtop)*(ih2/2);
  let g2=[-1,0,1].map(f=>`<line class="${f===0?'axis':'grid'}" x1="${l}" x2="${W-r}" y1="${gy(gtop*f)}" y2="${gy(gtop*f)}"/><text class="tick" x="${l-6}" y="${gy(gtop*f)+4}" text-anchor="end">${ax(gtop*f)}</text>`).join('');
  const gb=Math.min(28,gw-12);
  g2+=d.map((x,i)=>{const cx=l+gw*i+gw/2;let p='';if(x.g){const y1=gy(x.g),h=Math.abs(y1-z),rr=Math.min(4,h,gb/2),x0=cx-gb/2;
     p=x.g>0?`<path class="c-ein" d="M${x0},${z}V${y1+rr}Q${x0},${y1} ${x0+rr},${y1}H${x0+gb-rr}Q${x0+gb},${y1} ${x0+gb},${y1+rr}V${z}Z"/>`:`<path class="c-aus" d="M${x0},${z}V${y1-rr}Q${x0},${y1} ${x0+rr},${y1}H${x0+gb-rr}Q${x0+gb},${y1} ${x0+gb},${y1-rr}V${z}Z"/>`}
    return p+`<text class="tick" x="${cx}" y="${H2-8}" text-anchor="middle">${x.n}</text><rect class="hit" x="${l+gw*i}" y="${t}" width="${gw}" height="${ih2}" data-tip="<b>${x.n} ${y}</b><br>${x.g<0?'Verlust':'Gewinn'} ${eur(x.g)}"/>`}).join('');
  const jg=d.reduce((a,x)=>a+x.g,0);
  return `<div class="card chart" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline"><h3 style="margin:0">Einnahmen und Ausgaben ${esc(y)}</h3>
    <div class="legend"><span><i class="sw c-ein"></i>Einnahmen</span><span><i class="sw c-aus"></i>Ausgaben</span></div></div>
   <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Einnahmen und Ausgaben je Monat ${esc(y)}">${g1}</svg>
   <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-top:6px"><h3 style="margin:0">Gewinn / Verlust je Monat</h3><span class="small">Jahr ${esc(y)}: <b class="${jg<0?'minus':'plus'}">${jg<0?'Verlust':'Gewinn'} ${eur(jg)}</b></span></div>
   <div class="legend"><span><i class="sw c-ein"></i>Gewinn (über der Linie)</span><span><i class="sw c-aus"></i>Verlust (unter der Linie)</span></div>
   <svg viewBox="0 0 ${W} ${H2}" role="img" aria-label="Gewinn oder Verlust je Monat ${esc(y)}">${g2}</svg></div>`;
}

async function pinHash(pin){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('seen-salon:'+pin));return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function lockScreen(mode){const app=mode==='app';const neu=!S.settings.pinHash&&!app;const pin=UI.pin||'';
  if(UI.showRecovery)return `<div class="card grid" style="gap:14px;max-width:420px;margin:24px auto;text-align:center"><h2>Notfall-Code aufschreiben</h2>
   <p class="small" style="margin:0">Wenn die PIN vergessen wird, öffnet nur dieser Code die App wieder. Bitte jetzt auf Papier notieren und sicher aufbewahren. Er wird nur dieses eine Mal angezeigt.</p>
   <div style="font:700 2rem ui-monospace,Menlo,monospace;letter-spacing:.1em">${esc(UI.showRecovery)}</div><button class="btn primary" data-act="recovery-ok">Notiert</button></div>`;
  if(UI.pinRecover)return `<form data-form="recover" class="card grid" style="gap:14px;max-width:380px;margin:24px auto;text-align:center"><h2>PIN vergessen</h2>
   <p class="small muted" style="margin:0">Notfall-Code eingeben (wurde beim Festlegen der PIN angezeigt).</p><input name="code" autocomplete="off" autocapitalize="characters" style="text-align:center;font-size:1.3rem" placeholder="XXXXX-XXXXX">
   <button class="btn primary">Entsperren</button><button type="button" class="btn" data-act="recover-cancel">Zurück</button></form>`;
  return `<div class="card grid" style="gap:14px;max-width:380px;margin:24px auto;text-align:center"><h2>${app?'SEEN Salon gesperrt':neu?(UI.pinFirst?'PIN wiederholen':'PIN festlegen'):'Einstellungen gesperrt'}</h2>
   <p class="small muted" style="margin:0">${neu?'Legen Sie eine PIN (4–6 Ziffern) fest. Sie schützt Preise, Betriebsdaten und Einstellungen.':'Bitte PIN eingeben.'}</p>
   <div class="pin-dots" aria-live="polite">${[...Array(6)].map((_,i)=>`<i class="${i<pin.length?'on':''}"></i>`).join('')}</div>
   <div class="keypad">${['1','2','3','4','5','6','7','8','9','','0','⌫'].map(x=>x?`<button type="button" data-act="pin-key" data-k="${x}" aria-label="${x==='⌫'?'Löschen':x}">${x}</button>`:'<span></span>').join('')}</div>
   <button class="btn primary" data-act="pin-ok">${neu?'Weiter':'Entsperren'}</button>
   ${neu?'':'<button class="btn sm" data-act="pin-forgot" style="justify-self:center">PIN vergessen?</button>'}</div>`}
async function pinOk(){const pin=UI.pin||'';if(pin.length<4){toast('Bitte mindestens 4 Ziffern.');return}
  if(UI.appLocked){if(await pinHash(pin)===S.settings.pinHash){UI.appLocked=false;UI.pin='';lastActive=Date.now();renderNav();renderShell()}else{UI.pin='';toast('Falsche PIN.');renderBody()}return}
  if(!S.settings.pinHash){if(!UI.pinFirst){UI.pinFirst=pin;UI.pin='';renderBody();return}
    if(UI.pinFirst!==pin){UI.pinFirst=null;UI.pin='';toast('Die PINs stimmen nicht überein. Bitte neu festlegen.');renderBody();return}
    const code=recoveryCode();const h=await pinHash(pin),rh=await pinHash('R:'+code);
    await mutate('settings/main',d=>({...d,pinHash:h,recoveryHash:rh}));UI.pinFirst=null;UI.pin='';UI.unlocked=true;UI.showRecovery=code;renderShell();return}
  if(await pinHash(pin)===S.settings.pinHash){UI.unlocked=true;UI.pin='';renderShell()}else{UI.pin='';toast('Falsche PIN.');renderBody()}}

/* ---- Quittung PDF ---- */
function quittungPDF(e){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a5'});const s=S.settings;const W=148,x=14;let y=16;
  const k=kundeById(e.kundeId);
  doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text(s.firma||'SEEN Salon',x,y);y+=6;
  doc.setFont('helvetica','normal');doc.setFontSize(9);
  [s.inhaber,...String(s.adresse||'').split(/,\s*|\n/),[s.telefon?'Tel. '+s.telefon:'',s.email].filter(Boolean).join(' · '),s.steuernummer?'Steuernummer: '+s.steuernummer:''].filter(Boolean).forEach(l=>{doc.text(l,x,y);y+=4.3});
  y+=6;doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text((e.betrag>25000?'Rechnung':'Quittung')+' Nr. '+e.nr,x,y);y+=6;
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);
  doc.text('Rechnungs- und Leistungsdatum: '+fmtDate(e.datum),x,y);y+=5;
  if(k||e.kundeName){doc.text('Kunde: '+(k?kundeName(k):e.kundeName),x,y);y+=5;if(k&&k.adresse){doc.text(k.adresse,x+13,y);y+=5}}
  y+=3;doc.setDrawColor(180);doc.line(x,y,W-x,y);y+=6;
  const pos=(e.positionen&&e.positionen.length)?e.positionen:[{text:e.text,betrag:e.betrag}];
  pos.forEach(p=>{const lines=doc.splitTextToSize(String(p.text||''),W-2*x-30);doc.text(lines,x,y);doc.text(eurPlain(p.betrag)+' EUR',W-x,y,{align:'right'});y+=5*lines.length+1});
  if(e.positionen&&e.positionen.length){const diff=e.betrag-e.positionen.reduce((a,p)=>a+p.betrag,0);if(diff){doc.text(diff<0?'Nachlass':'Sonstiges',x,y);doc.text(eurPlain(diff)+' EUR',W-x,y,{align:'right'});y+=6}}
  doc.line(x,y,W-x,y);y+=6;doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text('Gesamtbetrag',x,y);doc.text(eurPlain(e.betrag)+' EUR',W-x,y,{align:'right'});y+=7;
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.text('Bezahlt: '+({bar:'bar',karte:'mit Karte',ueberweisung:'per Überweisung'}[e.zahlart]||''),x,y);y+=9;
  doc.setFontSize(8.5);doc.text('Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.',x,y);y+=10;doc.text('Vielen Dank für Ihren Besuch!',x,y);
  return doc.output('blob');
}

function exportKasse(filter,name){
  const sm=stornoMap();const rows=[['Belegnr','Datum','Erfasst am','Art','Zahlart','Kategorie','Text','Kunde','Betrag','Storno zu','Storniert durch']];
  S.kasse.filter(filter).forEach(k=>rows.push([k.nr,fmtDate(k.datum),fmtTs(k.ts),k.art==='einnahme'?'Einnahme':'Ausgabe',ZAHLART[k.zahlart],k.kategorie,k.text,k.kundeName||'',eurPlain(sign(k)*k.betrag),k.stornoVon||'',sm[k.nr]||'']));
  saveFile(name+'.csv',toCsv(rows));
}

const IDB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('seen-salon',1);
    r.onupgradeneeded=()=>{const d=r.result;['docs','blobs','meta'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  req(store,mode,fn){return new Promise((res,rej)=>{let t;try{t=this.db.transaction(store,mode)}catch(e){rej(e);return}
    const rq=fn(t.objectStore(store));let out;if(rq)rq.onsuccess=()=>{out=rq.result};
    t.oncomplete=()=>res(out);t.onerror=t.onabort=()=>{const e=t.error;rej(e&&e.name==='QuotaExceededError'?{code:'quota_exceeded'}:e)}})},
  get(s,k){return this.req(s,'readonly',st=>st.get(k))},
  put(s,k,v){return this.req(s,'readwrite',st=>st.put(v,k))},
  del(s,k){return this.req(s,'readwrite',st=>st.delete(k))},
  keys(s){return this.req(s,'readonly',st=>st.getAllKeys())},
  all(s){return this.req(s,'readonly',st=>st.getAll())},
  count(s){return this.req(s,'readonly',st=>st.count())}
};
const LocalDB={cache:new Map(),colL:new Map(),docL:new Map(),
  async load(){const ks=await IDB.keys('docs'),vs=await IDB.all('docs');ks.forEach((k,i)=>this.cache.set(k,vs[i]))},
  snap(path){const d=this.cache.get(path);return {id:path.split('/').pop(),exists:d!==undefined,data:()=>d}},
  qsnap(col){const docs=[];for(const [p,d] of this.cache){const s=p.split('/');if(s.length===2&&s[0]===col)docs.push({id:s[1],exists:true,data:()=>d})}
    docs.sort((a,b)=>a.id<b.id?-1:1);return {docs,size:docs.length,empty:!docs.length}},
  notify(path){const col=path.split('/')[0];(this.colL.get(col)||[]).forEach(f=>f(this.qsnap(col)));(this.docL.get(path)||[]).forEach(f=>f(this.snap(path)))},
  async write(path,data){const v=clone(data);await IDB.put('docs',path,v);this.cache.set(path,v);this.notify(path)},
  async remove(path){await IDB.del('docs',path);this.cache.delete(path);this.notify(path)},
  doc(path){const me=this;return {id:path.split('/').pop(),path,
    get:async()=>me.snap(path),
    set:d=>me.write(path,d),
    update:async d=>{const cur=me.cache.get(path);if(cur===undefined)throw {code:'invalid_argument'};
      const merge=(a,b)=>{const o={...a};for(const k in b){o[k]=(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object')?merge(a[k],b[k]):b[k]}return o};
      await me.write(path,merge(cur,d))},
    delete:()=>me.remove(path),
    onSnapshot(fn){const L=me.docL.get(path)||[];L.push(fn);me.docL.set(path,L);fn(me.snap(path));return()=>{}}}},
  collection(col){const me=this;return {path:col,doc:id=>me.doc(col+'/'+(id||uid())),
    onSnapshot(fn){const L=me.colL.get(col)||[];L.push(fn);me.colL.set(col,L);fn(me.qsnap(col));return()=>{}}}}
};

const MIME={pdf:'application/pdf',csv:'text/csv',json:'application/json',jpg:'image/jpeg',seen:'application/octet-stream'};
async function saveFile(filename,data){
  const ext=filename.split('.').pop().toLowerCase();const type=MIME[ext]||'application/octet-stream';
  const blob=data instanceof Blob?data:new Blob([data],{type});
  try{const f=new File([blob],filename,{type:blob.type||type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});return true}}
  catch(e){if(e&&e.name==='AbortError')return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return true;
}

const lieferKey=s=>String(s||'').toLowerCase().replace(/[^a-z0-9äöüß]/g,'').slice(0,24);
function belegAuswerten(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const amt=/(\d{1,3}(?:[.\s]\d{3})*|\d+)[,.](\d{2})(?!\d)/g;
  const val=s=>Math.round(Number(s.replace(/[.\s](?=\d{3}\b)/g,'').replace(/\s/g,'').replace(',','.'))*100);
  const kw=/(zu zahlen|gesamtbetrag|endbetrag|rechnungsbetrag|gesamt|summe|total|betrag)/i;
  let best=0;
  lines.forEach(l=>{if(!kw.test(l))return;const m=[...l.matchAll(amt)];if(m.length){const v=val(m[m.length-1][0]);if(v>best)best=v}});
  if(!best){lines.forEach(l=>{[...l.matchAll(amt)].forEach(m=>{const v=val(m[0]);if(v>best&&v<10000000)best=v})})}
  let datum='';const dm=text.match(/\b(\d{1,2})[.\/-](\d{1,2})[.\/-](20\d{2}|\d{2})\b/);
  if(dm){const y=dm[3].length===2?'20'+dm[3]:dm[3];const mo=Number(dm[2]),d=Number(dm[1]);if(mo>=1&&mo<=12&&d>=1&&d<=31)datum=`${y}-${pad(mo)}-${pad(d)}`}
  const firma=(lines.find(l=>/[A-Za-zÄÖÜäöü]{3,}/.test(l)&&!/rechnung|quittung|beleg|kassenbon|datum|seite/i.test(l))||'').replace(/[^\wÄÖÜäöüß&.,\- ]/g,'').trim().slice(0,60);
  return {betrag:best,datum,firma};
}
async function belegLesen(file,form){
  const st=$('#ocr-status',form);const set=t=>{if(st)st.textContent=t};
  if(/pdf/.test(file.type)){set('PDF: Betrag bitte selbst eintragen.');return}
  set('Rechnung wird gelesen …');
  try{const img=await compressImage(file,2000,.92);
    const text=await ocrText(img,st=>set(st==='laden'?'Texterkennung wird gestartet … (beim allerersten Mal ca. 5 MB laden)':'Rechnung wird gelesen …'));
    const r=belegAuswerten(text||'');let n=0;
    const b=form.querySelector('[name=betrag]');if(r.betrag&&b&&!b.value){b.value=eurPlain(r.betrag);n++}
    const d=form.querySelector('[name=datum]');if(r.datum&&d){d.value=r.datum;n++}
    const t=form.querySelector('[name=text]');if(r.firma&&t&&!t.value){t.value=r.firma;n++}
    if(r.firma){form.dataset.vendor=lieferKey(r.firma);const kat=(S.settings.lieferantKat||{})[form.dataset.vendor];const ks=form.querySelector('[name=kategorie]');if(kat&&ks)ks.value=kat}
    set(n?'Erkannt – bitte Betrag, Datum und Text prüfen.':'Nichts sicher erkannt – bitte selbst eintragen.');
  }catch(e){console.warn(e);set('Texterkennung nicht möglich ('+(e&&e.message||'Fehler')+') – bitte selbst eintragen.')}
}

/* ================= Datensicherung (täglich, verschlüsselbar) ================= */
const b64=buf=>{let s='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode.apply(null,a.subarray(i,i+32768));return btoa(s)};
const unb64=s=>{const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a};
async function aesKey(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function sicherungErstellen(alleFotos){
  const last=alleFotos?0:(await IDB.get('meta','lastBackupTs'))||0;const now=Date.now();
  const docs=[...LocalDB.cache].map(([path,data])=>({path,data}));
  const keys=await IDB.keys('blobs');const blobs=[];
  for(const id of keys){const r=await IDB.get('blobs',id);if(!r||r.ts<=last)continue;blobs.push({id,type:r.type,ts:r.ts,data:b64(await r.blob.arrayBuffer())})}
  let out={app:'SEEN Salon',v:1,erstellt:new Date(now).toISOString(),fotosAb:last,vollstaendig:!!alleFotos||!last,docs,blobs};
  let json=JSON.stringify(out);const pw=await IDB.get('meta','backupPw');
  if(pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await aesKey(pw,salt),new TextEncoder().encode(json));
    json=JSON.stringify({app:'SEEN Salon',v:1,verschluesselt:true,erstellt:out.erstellt,salt:b64(salt),iv:b64(iv),data:b64(ct)})}
  const name='SEEN-Sicherung_'+today()+'_'+pad(new Date().getHours())+pad(new Date().getMinutes())+'.json';
  const ok=await saveFile(name,new Blob([json],{type:'application/json'}));
  if(ok){await IDB.put('meta','lastBackupTs',now);UI.lastBackup=now;toast(`Sicherung erstellt (${blobs.length} neue Fotos). Bitte in OneDrive → Salon-Sicherung ablegen.`,6000);scheduleRender()}
}
async function sicherungLesen(file,pw){
  let j=JSON.parse(await file.text());
  if(j.verschluesselt){if(!pw)throw new Error('pw');const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(j.iv)},await aesKey(pw,unb64(j.salt)),unb64(j.data));j=JSON.parse(new TextDecoder().decode(pt))}
  if(j.app!=='SEEN Salon'||!Array.isArray(j.docs))throw new Error('format');return j;
}
async function sicherungLaden(files,pw){
  const list=[];for(const f of files){try{list.push(await sicherungLesen(f,pw))}catch(e){toast(e.message==='pw'?'Diese Sicherung ist verschlüsselt – bitte Passwort eingeben.':e.name==='OperationError'?'Falsches Passwort.':'„'+f.name+'“ ist keine gültige SEEN-Sicherung.',6000);return}}
  list.sort((a,b)=>a.erstellt<b.erstellt?-1:1);const neueste=list[list.length-1];
  for(const s of list)for(const b of s.blobs||[])await IDB.put('blobs',b.id,{blob:new Blob([unb64(b.data)],{type:b.type}),type:b.type,ts:b.ts,size:b.data.length*.75});
  for(const k of await IDB.keys('docs'))await IDB.del('docs',k);
  for(const d of neueste.docs)await IDB.put('docs',d.path,d.data);
  await IDB.put('meta','lastBackupTs',Date.now());
  toast('Sicherung geladen – App startet neu.',3000);setTimeout(()=>location.reload(),1200);
}

  line('Betriebseinnahmen',eur(sum(E)),true);Object.entries(E).forEach(([k,v])=>line('   '+k,eur(v)));

  line('Kleinunternehmergrenze (25.000 € / 100.000 €)',eur(umsatz)+' Umsatz '+jahr);
  line('Barbestand laut Buch (heute)',eur(barbestand()));
  const tage=[...new Set(L.filter(k=>k.tagesEinnahme).map(k=>k.datum))];const sturz=new Set(S.abschluesse.filter(a=>ymOf(a.datum)===ym).map(a=>a.datum));
  const ohne=tage.filter(t=>!sturz.has(t));line('Tage mit Einnahmen / ohne Kassensturz',tage.length+' / '+ohne.length+(ohne.length?' ('+ohne.map(fmtDate).join(', ')+')':''));
  const low=lowStock();if(low.length)line('Nachbestellen: '+low.map(a=>a.name).join(', ').slice(0,90));
  y+=4;line('Buchungen',null,true);doc.setFontSize(9);
  L.slice().sort((a,b)=>a.nr<b.nr?-1:1).forEach(k=>line(`${k.nr}  ${fmtDate(k.datum)}  ${ZAHLART[k.zahlart]||''}  ${String(k.text).slice(0,60)}${sm[k.nr]?' (storniert)':''}`,(k.art==='einnahme'?'':'− ')+eur(Math.abs(k.betrag))));
  if(!L.length)line('Keine Buchungen in diesem Monat.');
  return doc.output('blob');
}
