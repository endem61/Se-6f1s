[couchdb]
single_node = true
database_dir = /data/couchdb
view_index_dir = /data/couchdb
max_document_size = 33554432

[cluster]
q = 2
n = 1

[chttpd]
bind_address = 127.0.0.1
port = 5984
require_valid_user = true
max_http_request_size = 67108864
enable_cors = true

[chttpd_auth]
require_valid_user = true

[httpd]
enable_cors = true

[cors]
origins = https://endem61.github.io
credentials = true
methods = GET, PUT, POST, HEAD, DELETE, OPTIONS
headers = accept, authorization, content-type, origin, referer, if-match
max_age = 3600
